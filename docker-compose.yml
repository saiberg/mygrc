services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: mygrc-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-mygrc_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mygrc_password}
      POSTGRES_DB: ${DB_NAME:-mygrc_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mygrc_user} -d ${DB_NAME:-mygrc_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mygrc-network

  # NestJS API
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: mygrc-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      PORT: "3000"
      DATABASE_URL: "postgresql://${DB_USER:-mygrc_user}:${DB_PASSWORD:-mygrc_password}@db:5432/${DB_NAME:-mygrc_db}"
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mygrc-network

  # React/Vite Portal (served by nginx)
  portal:
    build:
      context: .
      dockerfile: apps/portal/Dockerfile
    container_name: mygrc-portal
    restart: unless-stopped
    ports:
      - "${PORTAL_PORT:-80}:80"
    depends_on:
      - api
    networks:
      - mygrc-network

volumes:
  pgdata:

networks:
  mygrc-network:
    driver: bridge
