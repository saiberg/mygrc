services:
  # NestJS API — connects to your existing PostgreSQL on Docker Desktop
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: mygrc-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      PORT: "3000"
      # Uses host.docker.internal to reach the host's PostgreSQL on port 5432
      DATABASE_URL: "postgresql://${DB_USER:-mygrc_user}:${DB_PASSWORD:-mygrc_password}@host.docker.internal:5432/${DB_NAME:-mygrc_db}"
      NODE_ENV: production
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - mygrc-network

  # React/Vite Portal (served by nginx)
  portal:
    build:
      context: .
      dockerfile: apps/portal/Dockerfile
    container_name: mygrc-portal
    restart: unless-stopped
    ports:
      - "${PORTAL_PORT:-80}:80"
    depends_on:
      - api
    networks:
      - mygrc-network

networks:
  mygrc-network:
    driver: bridge
