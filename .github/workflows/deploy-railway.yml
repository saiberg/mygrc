name: Deploy to Railway

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '*.md'
      - 'scratch/**'
      - '.vscode/**'
  workflow_dispatch: # Allow manual triggers

jobs:
  # Railway auto-deploys on push via GitHub integration.
  # This job is a manual trigger to force redeploy if needed.
  redeploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: |
          curl -fsSL https://railway.com/install.sh | sh
          echo "$HOME/.railway/bin" >> $GITHUB_PATH

      - name: Redeploy API
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway service redeploy --service api

      - name: Redeploy Portal
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway service redeploy --service portal
