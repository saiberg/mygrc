name: Deploy to Railway (Manual)

# Railway auto-deploys on push via GitHub integration.
# This workflow is only for manual redeploys when needed.

on:
  workflow_dispatch: # Manual trigger only
    inputs:
      service:
        description: 'Service to redeploy'
        required: true
        type: choice
        options:
          - api
          - portal
          - both

jobs:
  redeploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: |
          curl -fsSL https://railway.com/install.sh | sh
          echo "$HOME/.railway/bin" >> $GITHUB_PATH

      - name: Redeploy API
        if: ${{ github.event.inputs.service == 'api' || github.event.inputs.service == 'both' }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway service redeploy --service api

      - name: Redeploy Portal
        if: ${{ github.event.inputs.service == 'portal' || github.event.inputs.service == 'both' }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway service redeploy --service portal
