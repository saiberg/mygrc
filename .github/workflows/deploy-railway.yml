name: Deploy to Railway

# Deploys to Railway on push to main and supports manual trigger

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'apps/portal/**'
      - 'railway.toml'
      - '.github/workflows/deploy-railway.yml'
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy'
        required: true
        type: choice
        options:
          - api
          - portal
          - both

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        shell: bash
        run: |
          curl -fsSL https://railway.com/install.sh | bash
          echo "${HOME}/.railway/bin" >> $GITHUB_PATH

      - name: Deploy API
        if: |
          github.event_name == 'push' ||
          github.event.inputs.service == 'api' ||
          github.event.inputs.service == 'both'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service api --yes

      - name: Deploy Portal
        if: |
          github.event_name == 'push' ||
          github.event.inputs.service == 'portal' ||
          github.event.inputs.service == 'both'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service portal --yes
